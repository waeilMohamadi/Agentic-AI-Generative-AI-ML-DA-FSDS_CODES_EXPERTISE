spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

# MCP uses standard input/output; logging goes to standard error.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=shopping-cart-server
spring.ai.mcp.server.type=SYNC

spring.datasource.url=${SHOPPING_CART_DB_URL:jdbc:mysql://localhost:3306/shopping_cart}
spring.datasource.username=${SHOPPING_CART_DB_USER:root}
spring.datasource.password=${SHOPPING_CART_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
